version: "2"

linters:
  default: standard
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocritic
    - revive
    - bodyclose
    - copyloopvar
    - misspell
    - unconvert
    - unparam
  settings:
    revive:
      rules:
        - name: exported
        - name: error-strings
        - name: unused-parameter
    gocritic:
      disabled-checks:
        - ifElseChain
  exclusions:
    generated: lax
    presets:
      - comments
      - std-error-handling

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - pdy

run:
  timeout: 5m
